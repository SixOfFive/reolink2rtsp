name: reolink2rtsp
version: "0.1.0"
slug: reolink2rtsp
description: >-
  RTSP bridge for Reolink cameras that have no RTSP, ONVIF or HTTP - speaks
  their proprietary Baichuan protocol on TCP 9000 and republishes as RTSP.
url: https://github.com/SixOfFive/reolink2rtsp
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
boot: auto

# RTP over UDP uses ephemeral ports (20000-30000), which static port mapping
# cannot express, so the add-on shares the host network instead. That also puts
# the RTSP server on the same host as go2rtc/Frigate, so they reach it over
# loopback rather than pulling the stream across the LAN a second time.
host_network: true

options:
  log_level: info
  base_port: 8600
  mtu: 1400
  rtsp_users: RTSP_USER:RTSP_PASS
  cameras:
    - name: driveway
      host: 192.0.2.10
      username: admin
      password: ""
      stream: sub
      rtsp_port: 8600
      audio: true
      enabled: true
    - name: side_gate
      host: 192.0.2.12
      username: admin
      password: ""
      stream: sub
      rtsp_port: 8601
      audio: true
      enabled: true
    - name: back_door
      host: 192.0.2.14
      username: admin
      password: ""
      stream: sub
      rtsp_port: 8602
      audio: true
      enabled: true

schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  base_port: port?
  mtu: int(576,9000)?
  describe_timeout: int(1,120)?
  rtsp_users: str
  cameras:
    - name: match(^[A-Za-z0-9_-]+$)
      host: str
      username: str?
      password: password
      stream: list(main|extern|sub)?
      rtsp_port: port?
      rtsp_users: str?
      extra_streams: str?
      bitrate: int(64,16384)?
      framerate: int(1,60)?
      gop: int(1,120)?
      audio: bool?
      always_on: bool?
      enabled: bool?
