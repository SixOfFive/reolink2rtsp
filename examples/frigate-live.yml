# The configuration currently running on Frigate 0.17.2 (Full Access add-on),
# applied through Frigate's API over Home Assistant ingress.
#
# Two deliberate choices worth knowing about:
#
# 1. record is DISABLED. The Home Assistant OS disk had 11.5 GB free of 30.8 GB
#    when this was written. Three cameras recording 2560x1440 at ~3 Mbit/s is
#    roughly 3.3 GB/hour, which would fill that in about three hours and take
#    Home Assistant down with it. Point Frigate at real storage before enabling
#    it. Snapshots are on and are small.
#
# 2. mqtt is DISABLED, because no Frigate MQTT user exists yet. Frigate runs
#    fine without it, but the Home Assistant Frigate integration wants it -
#    create a user on the Mosquitto add-on and enable it here.
#
# The go2rtc URLs point at 192.168.15.102, where reolink2rtsp is running now.
# Once the reolink2rtsp add-on is installed on Home Assistant itself, change
# those to the Home Assistant host's IP - that is the whole point, since the
# stream then crosses the LAN once instead of twice. Nothing else changes.
#
# The cameras: inputs use 127.0.0.1:8554 and must stay that way: that is
# Frigate's own built-in go2rtc, which really is loopback inside Frigate.

mqtt:
  enabled: false

go2rtc:
  streams:
    driveway:
      - rtsp://test:test@192.168.15.102:8600/driveway#backchannel=0
    driveway_extern:
      - rtsp://test:test@192.168.15.102:8600/driveway/extern#backchannel=0
    driveway_main:
      - rtsp://test:test@192.168.15.102:8600/driveway/main#backchannel=0
    living_room:
      - rtsp://test:test@192.168.15.102:8601/living_room#backchannel=0
    living_room_extern:
      - rtsp://test:test@192.168.15.102:8601/living_room/extern#backchannel=0
    living_room_main:
      - rtsp://test:test@192.168.15.102:8601/living_room/main#backchannel=0
    work_area:
      - rtsp://test:test@192.168.15.102:8602/work_area#backchannel=0
    work_area_extern:
      - rtsp://test:test@192.168.15.102:8602/work_area/extern#backchannel=0
    work_area_main:
      - rtsp://test:test@192.168.15.102:8602/work_area/main#backchannel=0

detectors:
  cpu1:
    type: cpu
    num_threads: 3

detect:
  enabled: true
  fps: 5

record:
  enabled: false

snapshots:
  enabled: true
  retain:
    default: 7

objects:
  track:
    - person
    - car
    - dog
    - cat

cameras:
  driveway:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/driveway
          input_args: preset-rtsp-restream
          roles:
            - detect
    live:
      streams:
        low: driveway
        medium: driveway_extern
        high: driveway_main

  living_room:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/living_room
          input_args: preset-rtsp-restream
          roles:
            - detect
    live:
      streams:
        low: living_room
        medium: living_room_extern
        high: living_room_main

  work_area:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/work_area
          input_args: preset-rtsp-restream
          roles:
            - detect
    live:
      streams:
        low: work_area
        medium: work_area_extern
        high: work_area_main

version: 0.17-0
