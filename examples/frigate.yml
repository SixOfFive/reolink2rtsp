# Frigate configuration for cameras served by reolink2rtsp.
#
# Written for Frigate 0.17 (the Full Access add-on) with the reolink2rtsp
# add-on on the same Home Assistant host.
#
# Replace before use:
#   HA_HOST_IP            the Home Assistant machine's LAN IP, e.g. 192.0.2.2
#   RTSP_USER/RTSP_PASS   the `rtsp_users` set in the reolink2rtsp add-on
#                         (set in the add-on options)
#   FRIGATE_MQTT_*        an MQTT user you create for Frigate on Mosquitto
#
# Why the host IP and not 127.0.0.1 for reolink2rtsp: that add-on uses host
# networking, but Frigate may be bridged, and inside a bridged container
# 127.0.0.1 is the container rather than the host. The host IP works either
# way, and the traffic still never leaves the machine.
#
# Frigate manages the `version:` key itself, so it is deliberately absent.

mqtt:
  enabled: true
  host: HA_HOST_IP
  port: 1883
  user: FRIGATE_MQTT_USER
  password: FRIGATE_MQTT_PASSWORD
  topic_prefix: frigate

# go2rtc pulls each stream from reolink2rtsp once; Frigate's detect and record
# roles then both read go2rtc's restream, so the camera only ever sees one
# client per stream no matter how many consumers there are.
go2rtc:
  streams:
    driveway:
      - rtsp://RTSP_USER:RTSP_PASS@HA_HOST_IP:8600/driveway
    driveway_main:
      - rtsp://RTSP_USER:RTSP_PASS@HA_HOST_IP:8600/driveway/main
    side_gate:
      - rtsp://RTSP_USER:RTSP_PASS@HA_HOST_IP:8601/side_gate
    side_gate_main:
      - rtsp://RTSP_USER:RTSP_PASS@HA_HOST_IP:8601/side_gate/main
    back_door:
      - rtsp://RTSP_USER:RTSP_PASS@HA_HOST_IP:8602/back_door
    back_door_main:
      - rtsp://RTSP_USER:RTSP_PASS@HA_HOST_IP:8602/back_door/main

detectors:
  # Swap for a Coral or OpenVINO detector if you have one; cpu works but is slow.
  cpu1:
    type: cpu
    num_threads: 3

# Global defaults. Every camera inherits these and may override them, which is
# why the per-camera blocks below carry only their inputs.
ffmpeg:
  output_args:
    record: preset-record-generic-audio-copy

detect:
  enabled: true
  fps: 5

record:
  enabled: true
  retain:
    days: 7
    mode: motion
  alerts:
    retain:
      days: 30
  detections:
    retain:
      days: 30

snapshots:
  enabled: true
  retain:
    default: 14

objects:
  track:
    - person
    - car
    - dog
    - cat

# Detection runs on the 640x360 substream and recording on the 2560x1440 main
# stream. Detection gains nothing from the extra pixels and costs a lot of CPU,
# and the camera encodes both streams anyway, so the split is free.
cameras:
  driveway:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/driveway
          input_args: preset-rtsp-restream
          roles: [detect]
        - path: rtsp://127.0.0.1:8554/driveway_main
          input_args: preset-rtsp-restream
          roles: [record]

  side_gate:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/side_gate
          input_args: preset-rtsp-restream
          roles: [detect]
        - path: rtsp://127.0.0.1:8554/side_gate_main
          input_args: preset-rtsp-restream
          roles: [record]

  back_door:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/back_door
          input_args: preset-rtsp-restream
          roles: [detect]
        - path: rtsp://127.0.0.1:8554/back_door_main
          input_args: preset-rtsp-restream
          roles: [record]

# Notes
# -----
# * Two servers, two port ranges, and the distinction matters. reolink2rtsp
#   serves the cameras on 8600-8602, reached above at HA_HOST_IP. Frigate's own
#   built-in go2rtc serves its restream on 8554 *inside* Frigate, which is why
#   the `cameras:` inputs use 127.0.0.1 there - that one really is loopback.
#   The reolink2rtsp add-on defaults to 8600 precisely so it does not collide
#   with Frigate's 8554.
# * These cameras also offer an 896x512 `extern` stream
#   (rtsp://...:8600/driveway/extern), a reasonable middle ground for recording
#   if 2560x1440 is more than you want to store.
# * Audio is served as a second RTSP track (AAC-LC 16 kHz mono), which is why
#   the record preset above copies audio rather than dropping it.
# * The two currently offline cameras (back_yard, garage) are not listed. Add
#   them here, and enable them in the add-on, once they are reachable.
